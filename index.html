<!DOCTYPE html>
<html lang="pt" class="h-full bg-gray-900 text-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HairConcept - Gestão Premium de Salão</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col font-sans antialiased">

    <!-- Ecrã de Login / Autenticação -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-gray-900 via-gray-800 to-black">
        <div class="max-w-md w-full bg-gray-800/80 backdrop-blur-md rounded-2xl p-8 shadow-2xl border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">HairConcept</h1>
                <p class="text-sm text-gray-400 mt-2">Aceda ao seu Estabelecimento</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Nome do Salão (Estabelecimento)</label>
                    <input type="text" id="login-salao-nome" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-pink-500 transition-colors" placeholder="Ex: Studio Bella">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">CPF do Profissional</label>
                    <input type="text" id="login-cpf" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-pink-500 transition-colors" placeholder="000.000.000-00">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Senha</label>
                    <input type="password" id="login-senha" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-pink-500 transition-colors" placeholder="••••••••">
                </div>
                <div id="login-error" class="hidden text-sm text-red-400 text-center font-medium"></div>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all duration-200">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- Aplicação Principal (Dashboard) -->
    <div id="app-screen" class="hidden h-full flex flex-col">
        <!-- Cabeçalho Responsivo -->
        <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="bg-pink-600 p-2 rounded-lg text-white shadow">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <div>
                    <!-- Nome do Salão com Truncagem Adaptativa para Telemóveis -->
                    <h2 id="header-salao-nome" class="font-bold text-base md:text-lg truncate max-w-[150px] sm:max-w-xs" title="Estabelecimento">A carregar...</h2>
                    <span class="text-xs text-green-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> Online</span>
                </div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-4">
                <nav class="hidden md:flex space-x-1">
                    <button onclick="switchTab('agenda')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors text-pink-400 tab-btn" data-tab="agenda">Agenda</button>
                    <button onclick="switchTab('equipa')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors text-gray-300 tab-btn" data-tab="equipa">Equipa</button>
                    <button onclick="switchTab('stock')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors text-gray-300 tab-btn" data-tab="stock">Stock</button>
                </nav>
                <div id="user-info-badge" class="hidden sm:flex items-center text-xs bg-gray-700/60 px-3 py-1.5 rounded-lg border border-gray-600 text-gray-300">
                    <i class="fa-solid fa-user-tie mr-1.5 text-pink-400"></i><span id="header-prof-nome">Profissional</span>
                </div>
                <button onclick="logout()" class="bg-gray-700 hover:bg-red-600/20 hover:text-red-400 text-gray-300 p-2.5 rounded-lg transition-all" title="Terminar Sessão">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Navegação Inferior para Telemóveis -->
        <div class="md:hidden bg-gray-800 border-t border-gray-700 flex justify-around py-2 px-4 fixed bottom-0 left-0 right-0 z-50">
            <button onclick="switchTab('agenda')" class="flex flex-col items-center text-xs text-pink-400 tab-btn" data-tab="agenda"><i class="fa-solid fa-calendar-days text-lg mb-0.5"></i>Agenda</button>
            <button onclick="switchTab('equipa')" class="flex flex-col items-center text-xs text-gray-400 tab-btn" data-tab="equipa"><i class="fa-solid fa-users text-lg mb-0.5"></i>Equipa</button>
            <button onclick="switchTab('stock')" class="flex flex-col items-center text-xs text-gray-400 tab-btn" data-tab="stock"><i class="fa-solid fa-boxes-stacked text-lg mb-0.5"></i>Stock</button>
        </div>

        <!-- Conteúdo Dinâmico das Abas -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-20 md:pb-6">
            <!-- Aba Agenda -->
            <div id="tab-agenda" class="tab-content space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold">Agendamentos</h3>
                    <button onclick="carregarAgenda()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-1.5 rounded-lg text-xs text-gray-300"><i class="fa-solid fa-rotate mr-1"></i> Atualizar</button>
                </div>
                <div id="lista-agendamentos" class="space-y-3">
                    <!-- Preenchido via Supabase com base no estabelecimento_id -->
                    <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">A carregar agendamentos...</div>
                </div>
            </div>

            <!-- Aba Equipa -->
            <div id="tab-equipa" class="tab-content space-y-4 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold">Equipa do Salão</h3>
                    <button onclick="carregarEquipa()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-1.5 rounded-lg text-xs text-gray-300"><i class="fa-solid fa-rotate mr-1"></i> Atualizar</button>
                </div>
                <div id="lista-profissionais" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Preenchido via Supabase filtrando por estabelecimento_id -->
                </div>
            </div>

            <!-- Aba Stock -->
            <div id="tab-stock" class="tab-content space-y-4 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold">Gestão de Stock</h3>
                    <button onclick="carregarStock()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-1.5 rounded-lg text-xs text-gray-300"><i class="fa-solid fa-rotate mr-1"></i> Atualizar</button>
                </div>
                <div id="lista-stock" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Preenchido via Supabase na tabela produtos filtrando por estabelecimento_id -->
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Integração com Supabase e Lógica Multi-Tenant -->
    <script>
        // Configuração do Supabase (Insira as suas credenciais reais do projeto)
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Controlo de Navegação por Abas
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.tab === tabName) {
                    btn.classList.add('text-pink-400');
                    btn.classList.remove('text-gray-300', 'text-gray-400');
                } else {
                    btn.classList.remove('text-pink-400');
                    btn.classList.add('text-gray-300', 'text-gray-400');
                }
            });

            // Carregar dados específicos da aba ativa
            if(tabName === 'agenda') carregarAgenda();
            if(tabName === 'equipa') carregarEquipa();
            if(tabName === 'stock') carregarStock();
        }

        // Processo de Login baseado nas tabelas estabelecimentos e profissionais
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nomeSalaoInput = document.getElementById('login-salao-nome').value.trim();
            const cpfInput = document.getElementById('login-cpf').value.trim();
            const senhaInput = document.getElementById('login-senha').value.trim();
            const errorDiv = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            errorDiv.classList.add('hidden');
            loginBtn.textContent = 'A validar...';
            loginBtn.disabled = true;

            try {
                // 1. Procurar o estabelecimento pelo nome na tabela estabelecimentos
                const { data: estabData, error: estabError } = await supabaseClient
                    .from('estabelecimentos')
                    .select('id, nome_salao')
                    .ilike('nome_salao', nomeSalaoInput)
                    .single();

                if (estabError || !estabData) {
                    throw new Error('Estabelecimento não encontrado.');
                }

                // 2. Validar o profissional na tabela profissionais vinculado ao estabelecimento_id, cpf e senha
                const { data: profData, error: profError } = await supabaseClient
                    .from('profissionais')
                    .select('*')
                    .eq('estabelecimento_id', estabData.id)
                    .eq('cpf', cpfInput)
                    .eq('senha', senhaInput)
                    .single();

                if (profError || !profData) {
                    throw new Error('CPF ou senha inválidos para este salão.');
                }

                // Guardar sessão no localStorage
                localStorage.setItem('hairconcept_estab_id', estabData.id);
                localStorage.setItem('hairconcept_estab_nome', estabData.nome_salao);
                localStorage.setItem('hairconcept_prof_nome', profData.estabelecimento || 'Profissional');

                iniciarApp();

            } catch (err) {
                errorDiv.textContent = err.message || 'Erro ao efetuar login.';
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.textContent = 'Entrar no Sistema';
                loginBtn.disabled = false;
            }
        });

        function iniciarApp() {
            const nomeSalao = localStorage.getItem('hairconcept_estab_nome') || 'HairConcept';
            const nomeProf = localStorage.getItem('hairconcept_prof_nome') || 'Colaborador';
            
            document.getElementById('header-salao-nome').textContent = nomeSalao;
            document.getElementById('header-prof-nome').textContent = nomeProf;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            carregarAgenda();
        }

        function logout() {
            localStorage.clear();
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Funções de Carregamento Isoladas por Estabelecimento (Multi-Tenant)
        async function carregarAgenda() {
            const estabId = localStorage.getItem('hairconcept_estab_id');
            const container = document.getElementById('lista-agendamentos');
            container.innerHTML = '<div class="bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">A carregar agendamentos...</div>';

            // Nota: Se a tabela agendamentos precisar de join com profissionais do mesmo estabelecimento
            const { data, error } = await supabaseClient
                .from('agendamentos')
                .select('*')
                .order('data', { ascending: true });

            if (error) {
                container.innerHTML = `<div class="bg-red-900/20 border border-red-700 rounded-xl p-4 text-center text-red-400">Erro ao carregar agendamentos: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">Nenhum agendamento registado.</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex justify-between items-center shadow">
                    <div>
                        <h4 class="font-bold text-white"><i class="fa-solid fa-user mr-2 text-pink-400"></i>${item.cliente || 'Cliente'}</h4>
                        <p class="text-sm text-gray-400"><i class="fa-solid fa-scissors mr-1.5 text-gray-500"></i>${item.servico || 'Serviço'} • <i class="fa-solid fa-clock ml-2 mr-1 text-gray-500"></i>${item.horario || '--:--'} (${item.data || ''})</p>
                    </div>
                    <span class="bg-pink-600/20 text-pink-400 border border-pink-500/30 text-xs px-2.5 py-1 rounded-lg font-medium">Agendado</span>
                </div>
            `).join('');
        }

        async function carregarEquipa() {
            const estabId = localStorage.getItem('hairconcept_estab_id');
            const container = document.getElementById('lista-profissionais');
            container.innerHTML = '<div class="col-span-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">A carregar equipa...</div>';

            const { data, error } = await supabaseClient
                .from('profissionais')
                .select('*')
                .eq('estabelecimento_id', estabId);

            if (error) {
                container.innerHTML = `<div class="col-span-full bg-red-900/20 border border-red-700 rounded-xl p-4 text-center text-red-400">Erro: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="col-span-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">Nenhum profissional encontrado para este estabelecimento.</div>';
                return;
            }

            container.innerHTML = data.map(prof => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center space-x-4 shadow">
                    <div class="w-12 h-12 rounded-full bg-pink-600/20 border border-pink-500 flex items-center justify-center text-pink-400 font-bold text-lg">
                        ${(prof.estabelecimento || 'P').charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h4 class="font-bold text-white">${prof.estabelecimento || 'Profissional'}</h4>
                        <p class="text-xs text-gray-400">Cargo: ${prof.cargo || 'Cabeleireiro(a)'}</p>
                        <p class="text-xs text-gray-500 mt-0.5">Comissão: ${prof.comissao_pct || 0}%</p>
                    </div>
                </div>
            `).join('');
        }

        async function carregarStock() {
            const estabId = localStorage.getItem('hairconcept_estab_id');
            const container = document.getElementById('lista-stock');
            container.innerHTML = '<div class="col-span-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">A carregar stock...</div>';

            const { data, error } = await supabaseClient
                .from('produtos')
                .select('*')
                .eq('estabelecimento_id', estabId);

            if (error) {
                container.innerHTML = `<div class="col-span-full bg-red-900/20 border border-red-700 rounded-xl p-4 text-center text-red-400">Erro: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="col-span-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-center text-gray-400">Nenhum produto registado no stock deste salão.</div>';
                return;
            }

            container.innerHTML = data.map(prod => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col justify-between shadow">
                    <div>
                        <h4 class="font-bold text-white text-base">${prod.nome || 'Produto'}</h4>
                        <p class="text-xs text-gray-400 mt-1">Tipo: ${prod.tipo || 'Geral'}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-700 flex justify-between items-center text-sm">
                        <span class="text-gray-300">Qtd: <strong class="text-white">${prod.quantidade || 0}</strong></span>
                        <span class="text-pink-400 font-semibold">R$ ${(prod.preco_venda || 0).toFixed(2)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Verificar sessão ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('hairconcept_estab_id')) {
                iniciarApp();
            }
        });
    </script>
</body>
</html>
